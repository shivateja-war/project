<!DOCTYPE html>
<html> 
    <head><title>web page</title>
        <body> 
            <h1>Course Registration</h1>

            <form action="https://music.youtube.com/">

                <fieldset> 
                    <legend>Personal Information</legend>

                  <table>
                    <tr>
                        <td><label>Frist Name</label></td>
                 <td><input type ="text" name="Fn" placeholder="Ex:Thor"  size="15" required><br>
                 </td>
                 </tr>

                 <tr>
                 <td><label>Surname</label></td>
                 <td><input type ="text" name="Sn" placeholder="Ex:God Of Thunder" size="15" required><br>
                  </td>
                  </tr>

                  <tr>
                 <td><labal>Phone number </labal></td>
                 <td><input type="number" name="Pm" placeholder="Ex:111234XXXX" size="10" required><br>
                 </td>
                 </tr>
                 
                 <tr>
                 <td><labal>Email</labal></td>
                 <td><input type="email" name="em" placeholder="Ex:abcd@gmail.com" size="15" required><br>
                 </td>
                 </tr>

                 <tr>
                 <td><labal>password</labal></td>
                 <td><input type="password" name="pw" size="15" required><br>
                 </td>
                 <tr>
                    
                 <td><labal>conform password</labal></td>
                 <td><input type="conform password" name="cpw" size="15" required><br>
                  </td>
                  </tr>
                 
                  <tr>
                 <td><labal>DOB</labal></td>
                 <td><input type="date" name="dob" size="15" required><br>
                 </td>
                 </tr>
                </table>

                 <label>Gender</label>
                 <input type="radio" name="gd" size="15" required>male
                 <input type="radio" name="gd" size="15" required>female
                 <input type="radio" name="gd" size="15" required>custom<br>

                 <label> Select Country</label>
                 <select name="country" required>
                 <option name="India">India</option>
                 <option name="USA">USA</option>
                 <option name="Germany">Germany</option>
                 </select><br>

                 <labal>Upload Picture</labal>
                 <input type="File"><br>

                 <input type="reset"><br>
                 <input type="submit"><br>

             </fieldset>
    
            </from>
        </body>


    </head>
</html>
